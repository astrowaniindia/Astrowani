name: CI

# Basic sanity check on every PR — including ones opened by the bug-scan agent — before a
# human reviews them. Deliberately scoped to lint + typecheck, not a full native Android
# build: a real Gradle assembleDebug needs the Android SDK/NDK toolchain and would make this
# workflow slow and expensive for what's meant to be a quick sanity gate.
on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrowani-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astrowani-backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: |
          for f in $(git ls-files '*.js' | grep -v node_modules); do
            node --check "$f" || exit 1
          done

  customer-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrowani_customer-main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astrowani_customer-main/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Lint changed files only (informational — pre-existing errors not yet fixed)
        # The codebase has substantial pre-existing lint debt (59 errors, 816 warnings as of
        # 2026-08-05) that predates this workflow — `npm run lint` (whole repo) failed every
        # single PR regardless of content, which is worse than no gate at all. Lint only what
        # the PR actually touches so new code is held to a standard without blocking on debt
        # nobody asked this PR to fix.
        #
        # NON-BLOCKING since 2026-08-22, for the same reason the typecheck step below is.
        # Scoping to changed files did NOT dodge the debt: `...HEAD` diffs against the base
        # branch, so a long-lived feature branch inherits every file touched by every commit
        # on it — 47 files and 19 pre-existing errors on feat/remedies-cart-checkout, none
        # introduced by the PR. A gate that is red regardless of content teaches people to
        # ignore it, so this reports instead of failing until the debt is actually paid down.
        # Re-blocking is a one-line change: drop continue-on-error and the `|| echo`.
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          FILES=$(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- 'astrowani_customer-main/*.js' 'astrowani_customer-main/*.jsx' 'astrowani_customer-main/*.ts' 'astrowani_customer-main/*.tsx' | sed 's|^astrowani_customer-main/||')
          if [ -z "$FILES" ]; then
            echo "No JS/TS files changed in this app — skipping lint."
          else
            echo "Linting changed files:"; echo "$FILES"
            npx eslint $FILES || echo "::warning::eslint reported problems in changed files (non-blocking — see this step's log and the workflow comments)"
          fi
      - name: Typecheck (informational — pre-existing errors not yet fixed)
        # 13 pre-existing type errors as of 2026-08-05 (some in dead code referencing modules
        # that no longer exist). Whole-project tsc can't be scoped to just changed files the
        # way lint can, so this stays non-blocking until the existing errors are cleaned up.
        run: npx tsc --noEmit || echo "::warning::tsc reported pre-existing type errors (non-blocking, see workflow comments)"
        continue-on-error: true

  vendor-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astrowani_vendors-main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: astrowani_vendors-main/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Lint changed files only (informational — pre-existing errors not yet fixed)
        # Non-blocking for the same reason as the customer app's lint step above.
        continue-on-error: true
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          FILES=$(git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- 'astrowani_vendors-main/*.js' 'astrowani_vendors-main/*.jsx' 'astrowani_vendors-main/*.ts' 'astrowani_vendors-main/*.tsx' | sed 's|^astrowani_vendors-main/||')
          if [ -z "$FILES" ]; then
            echo "No JS/TS files changed in this app — skipping lint."
          else
            echo "Linting changed files:"; echo "$FILES"
            npx eslint $FILES || echo "::warning::eslint reported problems in changed files (non-blocking — see this step's log and the workflow comments)"
          fi
      - name: Typecheck (informational — pre-existing errors not yet fixed)
        run: npx tsc --noEmit || echo "::warning::tsc reported pre-existing type errors (non-blocking, see workflow comments)"
        continue-on-error: true
