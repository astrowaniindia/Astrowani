# Bake TODAY's reading into the 24 sign horoscope pages and the 24 daily Web
# Stories (aw/horoscope-stories.js), just after midnight IST,
# then tell IndexNow those pages changed.
#
# The reading changes every day, and it used to exist only after JavaScript ran
# in the browser. aw/bake-horoscopes.js writes it into the deployed HTML on the
# VPS (never into the repo, so git does not change daily). deploy-shop.yml runs
# the same bake after every website deploy, so a deploy never serves empty slots.
#
# GitHub may start a scheduled run some minutes late under load. The pages stay
# correct meanwhile: the in-page script always renders the visitor's own date.
#
# Same flock as every other deploy: they all touch /var/www on one box.
name: Daily horoscope bake

on:
  schedule:
    - cron: '31 18 * * *'   # 00:01 IST
  workflow_dispatch: {}

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Bake today's reading on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > /tmp/bake.sh <<'REMOTE'
          set -e
          exec 9>/tmp/astrowani-deploy.lock
          flock -w 300 9 || { echo "Timed out waiting for another deploy to finish"; exit 1; }
          cd /var/www/astrowani-monorepo
          node astrowani-website/aw/bake-horoscopes.js --root /var/www/astrowani/site
          chown -R www-data:www-data /var/www/astrowani/site
          REMOTE
          attempt=1
          until ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/bake.sh; do
            if [ "$attempt" -ge 3 ]; then echo "bake failed after 3 attempts"; exit 1; fi
            attempt=$((attempt + 1)); sleep 20
          done

      - name: Checkout (for the IndexNow script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            vps-deployment/scripts
            astrowani-website
            astrowani-backend/src
      - name: Tell IndexNow the 24 pages and their 24 Web Stories changed
        continue-on-error: true
        run: node vps-deployment/scripts/indexnow-submit.js --horoscopes
