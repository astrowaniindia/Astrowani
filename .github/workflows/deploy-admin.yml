name: Deploy admin dashboard to VPS

on:
  push:
    branches: [main]
    paths:
      - 'astrowani-admin/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy (retries the connection, serializes against deploy-backend)
        # Same lock as deploy-backend.yml, same reason: a commit touching both
        # astrowani-admin/** and astrowani-backend/** triggers both workflows
        # at once, and both `git reset --hard` the SAME shared checkout
        # (/var/www/astrowani-monorepo) — confirmed via the Actions tab racing
        # each other on 2026-08-10. The `flock` below on the same lock file
        # path as deploy-backend.yml means whichever one gets there first runs,
        # the other just waits its turn instead of corrupting the shared repo
        # mid-checkout. See MD files/vps-git-deploy-guide.md.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > /tmp/remote-deploy.sh <<'REMOTE_SCRIPT'
          set -e
          exec 9>/tmp/astrowani-deploy.lock
          flock -w 300 9 || { echo "Timed out waiting for the other deploy to finish"; exit 1; }

          cd /var/www/astrowani-monorepo
          git fetch origin main
          git reset --hard origin/main
          cd astrowani-admin
          npm install
          npm run build
          rm -rf /var/www/astrowani/admin/dist/*
          cp -r dist/* /var/www/astrowani/admin/dist/
          chown -R www-data:www-data /var/www/astrowani/admin
          REMOTE_SCRIPT

          attempt=1
          max_attempts=5
          until ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/remote-deploy.sh; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "SSH deploy failed after $max_attempts attempts — giving up."
              exit 1
            fi
            echo "SSH deploy attempt $attempt/$max_attempts failed, retrying in 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done
