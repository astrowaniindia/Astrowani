name: Deploy admin dashboard to VPS

on:
  push:
    branches: [main]
    paths:
      - 'astrowani-admin/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # BUILD ON THE RUNNER, NOT THE VPS (changed 2026-09-11). This used to SSH in and
      # run `npm install && npm run build` on the production box, which is the same
      # machine serving the API — a Vite build competing with Node for RAM was the
      # prime suspect for the sporadic 522s. The VPS now only receives static files.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        working-directory: astrowani-admin
        env:
          # Baked into the bundle at build time. This is the value the live admin
          # build was already carrying (measured 2026-09-11) — the VPS's untracked
          # .env supplied it before. Without it client.js falls back to localhost.
          VITE_API_URL: https://backend.astrowani.com
        run: |
          npm install
          npm run build
          test -f dist/index.html
          tar -czf /tmp/admin-dist.tgz -C dist .

      - name: Upload and swap in (retries the connection)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Extract into a fresh directory first, then swap, so a dropped connection
          # mid-upload can never leave a half-written dist being served. No flock and
          # no `git reset` any more: this no longer touches the shared checkout that
          # deploy-backend.yml resets, so the two workflows cannot race.
          cat > /tmp/remote-deploy.sh <<'REMOTE_SCRIPT'
          set -e
          NEW=/var/www/astrowani/admin/dist.new
          rm -rf "$NEW" && mkdir -p "$NEW"
          tar -xzf /tmp/admin-dist.tgz -C "$NEW"
          rm -f /tmp/admin-dist.tgz
          test -f "$NEW/index.html"
          rm -rf /var/www/astrowani/admin/dist.old
          if [ -d /var/www/astrowani/admin/dist ]; then mv /var/www/astrowani/admin/dist /var/www/astrowani/admin/dist.old; fi
          mv "$NEW" /var/www/astrowani/admin/dist
          chown -R www-data:www-data /var/www/astrowani/admin
          echo "admin dist swapped in"
          REMOTE_SCRIPT

          attempt=1
          max_attempts=5
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 -i $HOME/.ssh/deploy_key"
          until scp $SSH_OPTS /tmp/admin-dist.tgz "$VPS_USER@$VPS_HOST:/tmp/admin-dist.tgz" \
            && ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/remote-deploy.sh; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "SSH deploy failed after $max_attempts attempts — giving up."
              exit 1
            fi
            echo "SSH deploy attempt $attempt/$max_attempts failed, retrying in 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done

      - name: Confirm the live admin serves the new build
        # WHY THIS RUNS ON THE VPS (changed 2026-09-25): this used to curl the public URL from
        # the GitHub runner with a 15 s timeout. Anything that has to go from Cloudflare back to
        # this server is erratic from the runner's US edge -- measured 0.3 s to 22 s, about 1 in 6
        # requests over a second, some none in 25 s -- while the server itself is idle and answers
        # directly in milliseconds (see CLAUDE.md, "Admin slowness investigation"). That made a
        # deploy that had already succeeded report failure (run of 2026-09-25 06:59 UTC).
        # It now asks the VPS to fetch its own public URL (through Cloudflare, from the Mumbai
        # edge) and checks that the page references THIS build's bundle, which is a stronger
        # check than "returned 200": it proves the new files are what is being served.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          EXPECTED=$(grep -o 'assets/index-[^"]*\.js' astrowani-admin/dist/index.html | head -1)
          echo "expecting bundle: $EXPECTED"
          test -n "$EXPECTED"
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=10 -i $HOME/.ssh/deploy_key"
          for attempt in 1 2 3 4 5; do
            served=$(ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" 'curl -s --max-time 30 https://manu.astrowani.com/' | grep -o 'assets/index-[^"]*\.js' | head -1)
            echo "served bundle: ${served:-<none>} (attempt $attempt/5)"
            if [ "$served" = "$EXPECTED" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::manu.astrowani.com is not serving the new build ($EXPECTED) after 5 attempts (last saw: ${served:-nothing})"
          exit 1
