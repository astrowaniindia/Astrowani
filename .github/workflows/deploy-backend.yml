name: Deploy backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'astrowani-backend/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy (retries the connection, serializes against deploy-admin)
        # Two separate failure modes hit this workflow within the same day
        # (2026-08-09/10):
        #   1. "dial tcp <VPS_HOST>:22: i/o timeout" — the SSH connection itself
        #      never completed. Mitigated below by retrying the whole connection
        #      attempt, not just a command after connecting.
        #   2. A commit that touches BOTH astrowani-backend/** and
        #      astrowani-admin/** triggers this workflow AND deploy-admin.yml at
        #      the same time — and both `git reset --hard` the SAME shared
        #      checkout (/var/www/astrowani-monorepo). Confirmed via the Actions
        #      tab: both runs started in the same minute, admin finished in 16s,
        #      backend failed after 3m15s of retries hitting git-level
        #      contention. Fixed with `flock` around the git+install+restart
        #      block so the two workflows can never touch the shared directory
        #      at the same time — the second one just waits its turn instead of
        #      racing. See MD files/vps-git-deploy-guide.md.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > /tmp/remote-deploy.sh <<'REMOTE_SCRIPT'
          set -e
          exec 9>/tmp/astrowani-deploy.lock
          flock -w 300 9 || { echo "Timed out waiting for the other deploy to finish"; exit 1; }

          cd /var/www/astrowani-monorepo
          git fetch origin main
          git reset --hard origin/main
          cd astrowani-backend
          npm install --production
          pm2 restart astrowani-backend --update-env

          # Self-hosted background-removal service (astrologer profile photos —
          # see bg-removal-service/README.md). One-time venv setup on the first
          # deploy after this file's addition; subsequent deploys just reinstall
          # (fast no-op if requirements.txt hasn't changed) and restart.
          cd bg-removal-service
          if [ ! -d venv ]; then
            sudo apt-get update -y && sudo apt-get install -y python3-venv python3-pip
            python3 -m venv venv
          fi
          ./venv/bin/pip install -r requirements.txt
          pm2 describe bg-removal >/dev/null 2>&1 \
            && pm2 restart bg-removal --update-env \
            || pm2 start "venv/bin/uvicorn app:app --host 127.0.0.1 --port 5001" --name bg-removal
          pm2 save
          REMOTE_SCRIPT

          attempt=1
          max_attempts=5
          until ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/remote-deploy.sh; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "SSH deploy failed after $max_attempts attempts — giving up."
              exit 1
            fi
            echo "SSH deploy attempt $attempt/$max_attempts failed, retrying in 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done
