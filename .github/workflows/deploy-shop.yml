name: Deploy shop storefront to VPS

on:
  push:
    branches: [main]
    paths:
      - 'astrowani-shop/**'
      - 'astrowani-website/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy (retries the connection, serializes against the other deploys)
        # Same flock path as deploy-backend.yml / deploy-admin.yml, for the same reason:
        # all three reset the SAME shared checkout (/var/www/astrowani-monorepo), and two
        # concurrent `git reset --hard` runs against one working tree corrupt each other.
        # See MD files/vps-git-deploy-guide.md.
        #
        # Unlike the admin, there is no build step: astrowani-shop/ is committed already
        # built (plain HTML + hashed image files), so this is purely a copy.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > /tmp/remote-deploy.sh <<'REMOTE_SCRIPT'
          set -e
          exec 9>/tmp/astrowani-deploy.lock
          flock -w 300 9 || { echo "Timed out waiting for another deploy to finish"; exit 1; }

          cd /var/www/astrowani-monorepo
          git fetch origin main
          git reset --hard origin/main

          mkdir -p /var/www/astrowani/shop
          # Copy the new files in BEFORE deleting anything: a visitor loading the page
          # mid-deploy then still finds every asset, instead of getting a half-empty
          # directory for the second or two a delete-then-copy would leave behind.
          cp -r astrowani-shop/. /var/www/astrowani/shop/
          # Then drop assets that are no longer referenced (old content hashes).
          find /var/www/astrowani/shop/assets -type f -printf '%P\n' 2>/dev/null | while read -r f; do
            [ -f "astrowani-shop/assets/$f" ] || rm -f "/var/www/astrowani/shop/assets/$f"
          done

          chown -R www-data:www-data /var/www/astrowani/shop

          # Install the Nginx site on first deploy only. Without a block matching
          # shop.astrowani.com, Nginx falls through to the VPS default server, which is why
          # the subdomain served an unrelated site before this existed.
          #
          # The "only if absent" guard is load-bearing: certbot rewrites this file IN PLACE
          # to add the 443 block and the http->https redirect. Copying the repo version over
          # it on every deploy would silently strip TLS off the site the first time anyone
          # pushed a product change. Edit the live file by hand if the config needs to change
          # after certbot has run.
          SITE=/etc/nginx/sites-available/astrowani-shop
          if [ ! -f "$SITE" ]; then
            echo "installing nginx site (first deploy)"
            cp vps-deployment/nginx/astrowani-shop.conf "$SITE"
            ln -sf "$SITE" /etc/nginx/sites-enabled/astrowani-shop
          else
            echo "nginx site already present, leaving it alone"
          fi

          nginx -t && systemctl reload nginx
          echo "shop deployed: $(ls -1 /var/www/astrowani/shop/assets | wc -l) assets"

          # ---- astrowani-website, served at https://astrowani.com (since 2026-11-20) ----
          # Root /var/www/astrowani/site, nginx site vps-deployment/nginx/astrowani-site.conf
          # (installed by apply-astrowani-site.yml, not here). Until launch it lived at
          # shop.astrowani.com/test-site/, which now 301s here; nothing is written there
          # any more. Dev-only files are left out on purpose.
          SITE_ROOT=/var/www/astrowani/site
          mkdir -p "$SITE_ROOT"
          rsync -a --delete \
            --exclude 'dev-server.js' \
            --exclude 'concept-hero.html' \
            --exclude 'aw/chat-image-selftest.html' \
            --exclude 'aw/sync-chat-image-geometry.js' \
            --exclude 'aw/test-analytics-scrub.mjs' \
            astrowani-website/. "$SITE_ROOT/"
          # Today's horoscope reading into the 24 sign pages (aw/bake-horoscopes.js).
          # The repo holds empty BAKED slots, so without this a deploy would serve
          # pages with no reading in the HTML until the next daily run. A failed
          # bake must not fail the deploy: the pages still work, the script fills them.
          node astrowani-website/aw/bake-horoscopes.js --root "$SITE_ROOT" || echo "horoscope bake failed (pages still render by script)"
          chown -R www-data:www-data "$SITE_ROOT"
          echo "website deployed: $(find "$SITE_ROOT" -type f | wc -l) files"
          REMOTE_SCRIPT

          attempt=1
          max_attempts=5
          until ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 \
            -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/remote-deploy.sh; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "SSH deploy failed after $max_attempts attempts — giving up."
              exit 1
            fi
            echo "SSH deploy attempt $attempt/$max_attempts failed, retrying in 20s..."
            attempt=$((attempt + 1))
            sleep 20
          done

      # ---- IndexNow: tell Bing/Copilot which website pages this push changed ----
      # Runs on the runner, after the files are live. Only indexable pages, and a
      # push that only bumped ?v= asset versions announces nothing — see
      # vps-deployment/scripts/indexnow-submit.js. Pushes only (a manual run has no
      # "before" commit), and it can never fail the deploy.
      - name: Checkout (for the IndexNow diff)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Notify IndexNow of changed website pages
        if: github.event_name == 'push'
        continue-on-error: true
        run: node vps-deployment/scripts/indexnow-submit.js "${{ github.event.before }}" "${{ github.sha }}"
