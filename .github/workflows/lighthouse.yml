# Measure Core Web Vitals on a clean machine.
#
# WHY A RUNNER AND NOT A LAPTOP. Two things made this unmeasurable locally. The
# PageSpeed Insights API answers 429 from here — "Quota exceeded for quota
# metric 'Queries' and limit 'Queries per day'", i.e. the shared anonymous quota,
# not a transient blip. And a local Lighthouse run crashed Chrome twice
# (ERR_INSUFFICIENT_RESOURCES, then a DevTools protocol timeout). On top of that,
# this project already learned in the 2026-09-25 slowness investigation that the
# developer connection drops SYN packets — any timing measured from it describes
# the ISP, not the site.
#
# A runner has none of those problems and gives numbers that are comparable
# between runs, which is the point: this is for "did that change help", not for
# a score to frame.
#
# WHAT IT CANNOT TELL YOU. Lighthouse is a lab test with simulated throttling.
# Google ranks on CrUX — field data from real visits — and INP cannot be
# measured at all without real interactions. Both need Search Console. TBT below
# is the lab stand-in for INP and is not the same metric.
#
# Manual only. It makes no changes to anything; it loads public pages.

name: Lighthouse (manual)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs. Defaults to the five page types the audit asked for.
        required: false
        default: >-
          https://shop.astrowani.com/test-site/
          https://shop.astrowani.com/test-site/consult.html
          https://shop.astrowani.com/test-site/astrologers.html
          https://shop.astrowani.com/test-site/blog.html
          https://shop.astrowani.com/test-site/blog/understanding-kaal-sarp-dosh-meaning-and-practical-guidance
      form_factor:
        description: mobile or desktop
        required: false
        default: mobile
      ab_baseline:
        description: >-
          Optional git ref. When set, ALSO serves the website on the runner and
          compares the homepage at the run's commit against the whole website at this
          ref, 3 runs each — same machine, same server, so the live origin's
          variable response time is out of the comparison.
        required: false
        default: ''

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ab_baseline needs history

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Lighthouse
        env:
          URLS: ${{ inputs.urls }}
          FORM_FACTOR: ${{ inputs.form_factor }}
        run: |
          mkdir -p lh
          i=0
          for url in $URLS; do
            i=$((i+1))
            echo "::group::$url"
            # --no-sandbox is required for Chrome on a runner. Two runs would be
            # better statistics, but one is enough to see a regression and keeps
            # this quick; add --runs if that ever stops being true.
            npx --yes lighthouse@13.6.0 "$url" \
              --only-categories=performance \
              --form-factor="$FORM_FACTOR" \
              $( [ "$FORM_FACTOR" = "mobile" ] && echo --screenEmulation.mobile || echo --screenEmulation.disabled ) \
              --output=json --output-path="lh/report-$i.json" \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
              --quiet || echo "  (that URL failed; continuing)"
            echo "::endgroup::"
          done

      # A/B of the homepage on the runner (only when ab_baseline is set).
      # 12.2.1 used to be pinned here; it no longer understands the trace format of
      # the runner's Chrome (2026-11-16: the LCP-element, render-blocking and
      # layout-shift audits all failed with "reading 'frame_sequence'"), so the
      # diagnostics came back empty. Keep the pin current.
      - name: A/B the homepage against a baseline ref
        if: ${{ inputs.ab_baseline != '' }}
        env:
          BASE_REF: ${{ inputs.ab_baseline }}
          FORM_FACTOR: ${{ inputs.form_factor }}
        run: |
          set -e
          mkdir -p ab/head ab/base
          cp -r astrowani-website/. ab/head/
          # The WHOLE website as it was at the baseline, not just its index.html:
          # serving the old page with today's CSS and JS would hand the baseline
          # half of the change being measured.
          git archive "$BASE_REF" astrowani-website | tar -x -C ab/base --strip-components=1
          npx --yes http-server@14.1.1 ab/head -p 8081 -s -c-1 &
          npx --yes http-server@14.1.1 ab/base -p 8082 -s -c-1 &
          sleep 6
          for i in 1 2 3; do
            for v in head:8081 base:8082; do
              name=${v%%:*}; port=${v##*:}
              npx --yes lighthouse@13.6.0 "http://127.0.0.1:$port/" \
                --only-categories=performance --form-factor="$FORM_FACTOR" \
                $( [ "$FORM_FACTOR" = "mobile" ] && echo --screenEmulation.mobile || echo --screenEmulation.disabled ) \
                --output=json --output-path="lh/ab-$name-$i.json" \
                --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" --quiet || true
            done
          done
          echo "== HEAD (port 8081) vs $BASE_REF (port 8082) =="
          node .github/scripts/lighthouse-summary.js lh/ab-head-*.json lh/ab-base-*.json | tee ab-summary.txt
          { echo '### Homepage A/B'; echo '```'; cat ab-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise
        run: |
          node .github/scripts/lighthouse-summary.js lh/report-*.json | tee summary.txt
          {
            echo '```'
            cat summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: lh/
          retention-days: 14
