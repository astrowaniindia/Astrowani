name: Server diagnose (read-only)

# Manual only. Logs in to the VPS with the same deploy key the deploy workflows use and
# prints load, memory, network and web-server timings. Changes NOTHING. Added 2026-09-25 to
# find why the admin site is intermittently slow; run it from the Actions tab or
# `gh workflow run server-diagnose.yml`, read the log, and delete the workflow when done.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set +e
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > /tmp/diag.sh <<'REMOTE'
          echo "=== 1. ufw rules mentioning 443 (both IP versions)"
          sudo -n ufw status verbose 2>&1 | grep -E "443|Status|Default|Logging"
          echo "=== 2. ip6tables: rules + packet counters for 443"
          sudo -n ip6tables -S 2>&1 | grep -E "443|-P " | head -8
          sudo -n ip6tables -L ufw6-user-input -v -n 2>&1 | head -12
          echo "=== 3. what is nginx listening on"
          ss -ltn 2>&1 | grep -E ":443|:80 "
          echo "=== 4. server IPv6 addresses"
          ip -6 addr show scope global 2>&1 | grep inet6 | head -3
          echo "=== 5. firewall blocks of port 443 in the kernel log (UFW BLOCK ... DPT=443)"
          sudo -n journalctl -k --since "-6h" --no-pager 2>&1 | grep -E "UFW BLOCK" | grep "DPT=443" | awk '{for(i=1;i<=NF;i++) if($i ~ /^(SRC|PROTO)=/) printf $i" "; print ""}' | cut -c1-80 | sort | uniq -c | sort -rn | head -10
          sudo -n journalctl -k --since "-6h" --no-pager 2>&1 | grep -c "UFW BLOCK"
          echo "=== 6. how many nginx requests arrived over IPv6 vs IPv4 today (from Cloudflare edges)"
          awk '{ if ($1 ~ /:/) v6++; else v4++ } END{print "v6:", v6, " v4:", v4}' /var/log/nginx/access.log
          REMOTE
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/diag.sh
