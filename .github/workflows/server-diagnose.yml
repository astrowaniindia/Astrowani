name: Server diagnose (read-only)

# Manual only. Logs in to the VPS with the same deploy key the deploy workflows use and
# prints load, memory, network and web-server timings. Changes NOTHING. Added 2026-09-25 to
# find why the admin site is intermittently slow; run it from the Actions tab or
# `gh workflow run server-diagnose.yml`, read the log, and delete the workflow when done.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > /tmp/diag.sh <<'REMOTE'
          echo "=== host"; date -u; uptime; cat /proc/loadavg
          echo "=== memory"; free -m | head -3
          echo "=== disk"; df -h / | tail -1
          echo "=== connections"; ss -s | head -4
          echo "conntrack: $(cat /proc/sys/net/netfilter/nf_conntrack_count 2>/dev/null) / $(cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null)"
          echo "=== pm2"; pm2 jlist 2>/dev/null | python3 -c "import sys,json; [print(p['name'],p['pm2_env']['status'],'restarts='+str(p['pm2_env']['restart_time']),'mem='+str(p['monit']['memory']//1048576)+'MB','cpu='+str(p['monit']['cpu'])+'%') for p in json.load(sys.stdin)]" 2>&1 | head
          echo "=== origin timings FROM THE SERVER ITSELF (x8 each)"
          for i in 1 2 3 4 5 6 7 8; do curl -s -o /dev/null -k -m 30 -H "Host: manu.astrowani.com" -w "admin index  ttfb=%{time_starttransfer}s total=%{time_total}s code=%{http_code}\n" https://127.0.0.1/; done
          curl -s -o /dev/null -k -m 30 -H "Host: manu.astrowani.com" -H "accept-encoding: gzip" -w "admin js      ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download} code=%{http_code}\n" https://127.0.0.1/assets/index-BY8bnQyr.js
          for i in 1 2 3 4; do curl -s -o /dev/null -m 30 -w "backend :4500 ttfb=%{time_starttransfer}s total=%{time_total}s code=%{http_code}\n" http://127.0.0.1:4500/api/astrologers; done
          echo "=== the public URL, requested FROM the server (goes out to Cloudflare and back)"
          for i in 1 2 3 4 5 6; do curl -s -o /dev/null -m 40 -w "public manu ttfb=%{time_starttransfer}s total=%{time_total}s code=%{http_code}\n" https://manu.astrowani.com/; done
          echo "=== outbound network"
          ping -c 5 -q 1.1.1.1 2>&1 | tail -2
          curl -s -m 20 -w "cloudflare trace: %{time_total}s\n" https://www.cloudflare.com/cdn-cgi/trace -o /tmp/trace.txt; grep -E "colo|ip=" /tmp/trace.txt
          echo "=== nginx"
          systemctl is-active nginx 2>&1
          ls -l /var/log/nginx/ 2>&1 | head -5
          tail -n 15 /var/log/nginx/error.log 2>&1
          echo "=== nginx access-log tail (readable?)"
          tail -n 5 /var/log/nginx/access.log 2>&1 | cut -c1-220
          echo "=== fail2ban"
          fail2ban-client status sshd 2>&1 | head -8
          echo "=== recent kernel network warnings"
          dmesg 2>&1 | grep -iE "conntrack|drop|martian|TCP: |nf_" | tail -8
          REMOTE
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" 'bash -s' < /tmp/diag.sh
