name: Server diagnose (read-only)

# Manual only. Times the public sites from the GitHub runner. Changes NOTHING. Added
# 2026-09-25 to find why the admin site is intermittently slow; delete when done.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Time the public sites
        run: |
          set +e
          W='ttfb=%{time_starttransfer}s total=%{time_total}s code=%{http_code} colo-ip=%{remote_ip}'
          echo "=== 1. admin index.html (NOT cached by Cloudflare: goes to the origin) x12"
          for i in $(seq 1 12); do curl -s -o /dev/null -m 30 -D /tmp/h.txt -w "$W\n" https://manu.astrowani.com/; grep -iE "^cf-ray|^cf-cache-status" /tmp/h.txt | tr -d '\r' | tr '\n' ' '; echo; done
          echo "=== 2. admin JS bundle (CACHED at Cloudflare's edge: origin not involved) x12"
          for i in $(seq 1 12); do curl -s -o /dev/null -m 45 -D /tmp/h.txt -H "accept-encoding: gzip" -w "$W\n" https://manu.astrowani.com/assets/index-BY8bnQyr.js; grep -iE "^cf-ray|^cf-cache-status|^age" /tmp/h.txt | tr -d '\r' | tr '\n' ' '; echo; done
          echo "=== 3. same index.html forced to HTTP/1.1 x6"
          for i in $(seq 1 6); do curl -s -o /dev/null -m 30 --http1.1 -w "$W\n" https://manu.astrowani.com/; done
          echo "=== 4. backend API through Cloudflare x8"
          for i in $(seq 1 8); do curl -s -o /dev/null -m 30 -w "$W\n" https://backend.astrowani.com/api/astrologers; done
          echo "=== 5. the shop site x6"
          for i in $(seq 1 6); do curl -s -o /dev/null -m 30 -w "$W\n" https://shop.astrowani.com/; done
          echo "=== 6. control: another Cloudflare-proxied site (cloudflare.com) x4"
          for i in $(seq 1 4); do curl -s -o /dev/null -m 30 -w "$W\n" https://www.cloudflare.com/; done
