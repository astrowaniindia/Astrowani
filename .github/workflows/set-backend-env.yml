# Copies a FIXED allowlist of keys from GitHub secrets into the VPS backend .env and
# restarts the backend. Manual only. The backend .env is root-owned and only the
# deploy workflows' SSH key can write it, so this is how new keys reach the server
# without anyone pasting them into a chat or a terminal.
#
# To add a key: add its GitHub secret, then add it to KEYS below and to `env:`.
# Secret names cannot start with GITHUB_, so GITHUB_ALERT_TOKEN is stored as
# ALERT_GITHUB_TOKEN and renamed on the way in.
name: Set backend env keys

on:
  workflow_dispatch: {}

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Write keys and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SENTRY_WEBHOOK_SECRET: ${{ secrets.SENTRY_WEBHOOK_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_ALERT_TOKEN: ${{ secrets.ALERT_GITHUB_TOKEN }}
          # Not a secret — a fixed literal, not a GitHub secret. Required for
          # sessionManager's billing/earnings-reset/stale-request loops to run at all
          # (see index.js's server.listen callback). Missing or any other value keeps
          # them off, which is the safe default for a local/test boot — production is
          # the one place this must be 'true'.
          ENABLE_SESSION_MANAGER: 'true'
          # ── Blog agent (2026-10-13) ────────────────────────────────────────
          # The seventh Gemini key ("rajiv"), last in the chain in
          # src/blogAgent/gemini.js and src/freeChatAi.js's naming convention.
          GEMINI_API_KEY_RAJIV: ${{ secrets.GEMINI_API_KEY_RAJIV }}
          # Free Pexels key — photographs for blog articles. WITHOUT IT the agent
          # still works, but every article gets a locally drawn gradient card
          # instead of a photograph (src/blogAgent/images.js falls through to its
          # no-key generator). Free tier: 200 requests/hour; the agent needs 3/day.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Unsplash is the provider actually in use (2026-10-13): Pexels PAUSED new
          # API key issuance, so the Pexels var above is kept only in case they
          # reopen. Unsplash's licence REQUIRES crediting the photographer, which
          # src/blogAgent/images.js does automatically, and its API terms require
          # pinging the download endpoint on use, which it also does.
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # ── Razorpay webhook (2026-10-15) ──────────────────────────────────
          # Razorpay -> us, server-to-server, for a payment captured at the
          # gateway whose app died before POST /api/wallet/verify-payment landed.
          # That is not a rare edge: a UPI intent hands the customer off to
          # GPay/PhonePe, Android reclaims the backgrounded RN activity, and the
          # RazorpayCheckout.open() promise the app is awaiting never resolves —
          # so no verify call is ever made, no error is reported, and the money
          # is taken with nothing credited. src/razorpayWebhookRoutes.js closes
          # exactly that gap and is already registered (index.js), but with this
          # unset it refuses every call 503 and does nothing (fail closed — an
          # unsigned "payment captured" must never credit anybody).
          # MUST equal the secret entered on the Razorpay webhook itself.
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        run: |
          set -e
          KEYS="SENTRY_WEBHOOK_SECRET SENTRY_AUTH_TOKEN GITHUB_ALERT_TOKEN ENABLE_SESSION_MANAGER"
          # Optional keys: added to the allowlist only when the GitHub secret is
          # actually set. The loop below hard-FAILS on an empty value, which is the
          # right behaviour for a required secret and the wrong one for an optional
          # one — without this guard, adding PEXELS_API_KEY here would break every
          # run of this workflow until somebody created the secret.
          # An `if`, not `[ -n ... ] && KEYS=...`: under `set -e` a failing test at
          # the head of an && list exits the whole job, so the short form would
          # abort this workflow precisely when a key is NOT set — the one case the
          # guard exists to survive.
          for opt in GEMINI_API_KEY_RAJIV PEXELS_API_KEY UNSPLASH_ACCESS_KEY RAZORPAY_WEBHOOK_SECRET; do
            if [ -n "${!opt}" ]; then KEYS="$KEYS $opt"; fi
          done
          echo "writing: $KEYS"
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          : > /tmp/newkeys
          for k in $KEYS; do
            v="${!k}"
            [ -n "$v" ] || { echo "::error::secret for $k is empty"; exit 1; }
            printf '%s=%s\n' "$k" "$v" >> /tmp/newkeys
          done
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" "
            set -e
            cd /var/www/astrowani-monorepo/astrowani-backend
            cp .env .env.bak-\$(date +%Y%m%d%H%M%S)
            grep -vE '^($(echo $KEYS | tr ' ' '|'))=' .env > .env.tmp || true
            [ -z \"\$(tail -c1 .env.tmp)\" ] || echo >> .env.tmp
            cat >> .env.tmp
            chmod --reference=.env .env.tmp && mv .env.tmp .env
            grep -oE '^($(echo $KEYS | tr ' ' '|'))=' .env
            pm2 restart astrowani-backend --update-env > /dev/null && echo restarted
          " < /tmp/newkeys
          rm -f /tmp/newkeys ~/.ssh/k
