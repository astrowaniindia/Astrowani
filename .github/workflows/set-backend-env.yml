# Copies a FIXED allowlist of keys from GitHub secrets into the VPS backend .env and
# restarts the backend. Manual only. The backend .env is root-owned and only the
# deploy workflows' SSH key can write it, so this is how new keys reach the server
# without anyone pasting them into a chat or a terminal.
#
# To add a key: add its GitHub secret, then add it to KEYS below and to `env:`.
# Secret names cannot start with GITHUB_, so GITHUB_ALERT_TOKEN is stored as
# ALERT_GITHUB_TOKEN and renamed on the way in.
name: Set backend env keys

on:
  workflow_dispatch: {}

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - name: Write keys and restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SENTRY_WEBHOOK_SECRET: ${{ secrets.SENTRY_WEBHOOK_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GITHUB_ALERT_TOKEN: ${{ secrets.ALERT_GITHUB_TOKEN }}
          # Not a secret — a fixed literal, not a GitHub secret. Required for
          # sessionManager's billing/earnings-reset/stale-request loops to run at all
          # (see index.js's server.listen callback). Missing or any other value keeps
          # them off, which is the safe default for a local/test boot — production is
          # the one place this must be 'true'.
          ENABLE_SESSION_MANAGER: 'true'
          # ── Blog agent (2026-10-13) ────────────────────────────────────────
          # The seventh Gemini key ("rajiv"), last in the chain in
          # src/blogAgent/gemini.js and src/freeChatAi.js's naming convention.
          GEMINI_API_KEY_RAJIV: ${{ secrets.GEMINI_API_KEY_RAJIV }}
          # Free Pexels key — photographs for blog articles. WITHOUT IT the agent
          # still works, but every article gets a locally drawn gradient card
          # instead of a photograph (src/blogAgent/images.js falls through to its
          # no-key generator). Free tier: 200 requests/hour; the agent needs 3/day.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Unsplash is the provider actually in use (2026-10-13): Pexels PAUSED new
          # API key issuance, so the Pexels var above is kept only in case they
          # reopen. Unsplash's licence REQUIRES crediting the photographer, which
          # src/blogAgent/images.js does automatically, and its API terms require
          # pinging the download endpoint on use, which it also does.
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # ── Razorpay webhook (2026-10-15) ──────────────────────────────────
          # Razorpay -> us, server-to-server, for a payment captured at the
          # gateway whose app died before POST /api/wallet/verify-payment landed.
          # That is not a rare edge: a UPI intent hands the customer off to
          # GPay/PhonePe, Android reclaims the backgrounded RN activity, and the
          # RazorpayCheckout.open() promise the app is awaiting never resolves —
          # so no verify call is ever made, no error is reported, and the money
          # is taken with nothing credited. src/razorpayWebhookRoutes.js closes
          # exactly that gap and is already registered (index.js), but with this
          # unset it refuses every call 503 and does nothing (fail closed — an
          # unsigned "payment captured" must never credit anybody).
          # MUST equal the secret entered on the Razorpay webhook itself.
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          # ── Failed-payment email alerts (2026-10-16) ──────────────────────
          # Brevo (free tier 300/day) sends them; src/mailer.js posts to its API
          # with axios, so there is no new npm dependency. Nothing is sent until
          # all three are set — the alerting is simply off, it does not error.
          # ALERT_EMAIL_TO is the address to change when the owner wants alerts
          # somewhere other than the Razorpay account's own inbox; comma-separate
          # for several. The ALERT_EMAIL_FROM address must be a VERIFIED SENDER in
          # Brevo (Senders & IPs -> Senders; a plain Gmail is fine, no domain setup
          # needed) — an unverified one is rejected, and that is the likeliest
          # reason a setup that looks correct delivers nothing.
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          # Only needed if the payment.failed webhook (/api/razorpay/webhook/alerts)
          # was given its own secret. Left unset, that path verifies against
          # RAZORPAY_WEBHOOK_SECRET, so reusing one secret for both needs nothing here.
          RAZORPAY_WEBHOOK_SECRET_ALERTS: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_ALERTS }}
          # -- APNs VoIP push, iOS astrologer app (2026-10-19) -----------------
          # Without these the astrologer's iPhone NEVER rings for a call arriving
          # while the app is killed: src/voipPush.js logs "APNs VoIP not configured"
          # at boot and every such call is silently missed. FCM and the socket paths
          # are unaffected, which is exactly why this is easy to miss - the app looks
          # fine until the phone is locked.
          #
          # Only KEY_ID + TEAM_ID + PRIVATE_KEY are required; the other two have
          # correct defaults in code and are here so they can be changed without a
          # deploy. APNS_PRIVATE_KEY_PATH is deliberately NOT here: this workflow
          # writes env VALUES, never files, so a path would point at nothing.
          #
          # APNS_PRIVATE_KEY is the .p8 contents on ONE line with its newlines
          # escaped. A real multi-line secret would append raw newlines to the VPS
          # .env and silently truncate the key - the run step below refuses that
          # rather than letting it through.
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          # Defaults to com.astrowaniVendor.voip in code. The ".voip" suffix is
          # required; without it APNs answers 400 TopicDisallowed, which reads like a
          # credential problem and sends you looking in the wrong place.
          APNS_VOIP_TOPIC: ${{ secrets.APNS_VOIP_TOPIC }}
          # "true" ONLY once TestFlight/App Store builds are in use; defaults to
          # sandbox in code. A sandbox token sent to the production host (or the
          # reverse) fails BadDeviceToken - the single most common cause of iOS push
          # appearing to do nothing at all.
          APNS_PRODUCTION: ${{ secrets.APNS_PRODUCTION }}
        run: |
          set -e
          KEYS="SENTRY_WEBHOOK_SECRET SENTRY_AUTH_TOKEN GITHUB_ALERT_TOKEN ENABLE_SESSION_MANAGER"
          # Optional keys: added to the allowlist only when the GitHub secret is
          # actually set. The loop below hard-FAILS on an empty value, which is the
          # right behaviour for a required secret and the wrong one for an optional
          # one — without this guard, adding PEXELS_API_KEY here would break every
          # run of this workflow until somebody created the secret.
          # An `if`, not `[ -n ... ] && KEYS=...`: under `set -e` a failing test at
          # the head of an && list exits the whole job, so the short form would
          # abort this workflow precisely when a key is NOT set — the one case the
          # guard exists to survive.
          # NOTE: real line continuations. This list previously held a literal
          # backslash-n, which bash expands to the word `n` - a spurious iteration
          # that stayed harmless only because ${!n} is unset.
          for opt in GEMINI_API_KEY_RAJIV PEXELS_API_KEY UNSPLASH_ACCESS_KEY RAZORPAY_WEBHOOK_SECRET \
                     BREVO_API_KEY ALERT_EMAIL_TO ALERT_EMAIL_FROM \
                     RAZORPAY_WEBHOOK_SECRET_ALERTS \
                     APNS_KEY_ID APNS_TEAM_ID APNS_PRIVATE_KEY \
                     APNS_VOIP_TOPIC APNS_PRODUCTION; do
            if [ -n "${!opt}" ]; then KEYS="$KEYS $opt"; fi
          done
          echo "writing: $KEYS"
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          : > /tmp/newkeys
          for k in $KEYS; do
            v="${!k}"
            [ -n "$v" ] || { echo "::error::secret for $k is empty"; exit 1; }
            # A .env is one KEY=VALUE per LINE. A secret containing a real newline
            # would append its tail as separate, malformed lines: dotenv then reads a
            # TRUNCATED value and the backend starts with a key that is silently wrong
            # rather than absent - which is far harder to diagnose than a failed run.
            # This bites APNS_PRIVATE_KEY first, since a .p8 is natively multi-line and
            # must be pasted with its newlines escaped, but the rule is general.
            case $v in
              *$'\n'*) echo "::error::secret for $k contains a newline; a .env value must be one line (for a .p8, escape its newlines)"; exit 1 ;;
            esac
            printf '%s=%s\n' "$k" "$v" >> /tmp/newkeys
          done
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" "
            set -e
            cd /var/www/astrowani-monorepo/astrowani-backend
            cp .env .env.bak-\$(date +%Y%m%d%H%M%S)
            grep -vE '^($(echo $KEYS | tr ' ' '|'))=' .env > .env.tmp || true
            [ -z \"\$(tail -c1 .env.tmp)\" ] || echo >> .env.tmp
            cat >> .env.tmp
            chmod --reference=.env .env.tmp && mv .env.tmp .env
            grep -oE '^($(echo $KEYS | tr ' ' '|'))=' .env
            pm2 restart astrowani-backend --update-env > /dev/null && echo restarted
          " < /tmp/newkeys
          rm -f /tmp/newkeys ~/.ssh/k
