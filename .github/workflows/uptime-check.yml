name: Backend uptime check

# Sentry only sees errors while the Node process is alive. If the whole process crashes
# or the VPS goes down, nothing reports that — this pings the backend independently, from
# GitHub's infra rather than the VPS itself, so a dead VPS can't also silence its own
# monitor. Runs every 15 minutes; a failed run shows up in the Actions tab and (by default,
# unless notifications are disabled for this repo) emails the repo owner.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS CHECKS MORE THAN AN HTTP CODE NOW
#
# On 2026-08-26 the backend was effectively down for ~9 hours and this workflow
# stayed GREEN throughout. The VPS rebooted (unattended-upgrades), the process
# re-read .env and picked up a Supabase key the database rejects, so every real
# query failed — but /health was a hardcoded `res.status(200)` that never touched
# the database, so it kept answering 200 and this job kept passing.
#
# Two changes came out of that:
#   1. /health in the backend is now a DEEP check and answers 503 when it cannot
#      reach the database.
#   2. This job no longer trusts a status code alone. It asserts the response
#      BODY says the database is ok, and separately proves a real data endpoint
#      actually returns rows.
#
# The principle: a monitor that cannot fail during a real outage is not a monitor.
# If you add a dependency the app cannot work without, assert it here too.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Deep health check
        run: |
          body=$(curl -s --max-time 15 -w '\n%{http_code}' https://backend.astrowani.com/health)
          status=$(echo "$body" | tail -n1)
          json=$(echo "$body" | sed '$d')
          echo "HTTP $status"
          echo "$json"

          if [ "$status" != "200" ]; then
            echo "::error::Backend /health returned HTTP $status. Body: $json"
            exit 1
          fi

          # Belt and braces: even on a 200, confirm the body actually claims the
          # database is reachable. A future refactor could reintroduce a shallow
          # 200 without noticing; this assertion would still fail.
          if ! echo "$json" | grep -q '"database":"ok"'; then
            echo "::error::/health returned 200 but does not report database ok. Body: $json"
            exit 1
          fi

      - name: Prove a real data endpoint returns data
        run: |
          # /health proves the backend can reach the database. This proves the
          # app's actual read path works end to end — the symptom users see first
          # is an empty astrologer list, so assert it is NOT empty.
          json=$(curl -s --max-time 20 https://backend.astrowani.com/api/astrologers)
          head=$(echo "$json" | head -c 200)
          echo "$head"

          if echo "$json" | grep -q '"error"'; then
            echo "::error::/api/astrologers returned an error: $head"
            exit 1
          fi
          # An empty data array is exactly what the outage looked like from the app.
          if echo "$json" | tr -d ' ' | grep -q '"data":\[\]'; then
            echo "::error::/api/astrologers returned ZERO astrologers — the app would look broken. $head"
            exit 1
          fi
          if ! echo "$json" | grep -q '"data"'; then
            echo "::error::/api/astrologers response has no data field: $head"
            exit 1
          fi
