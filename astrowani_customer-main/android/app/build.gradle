apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'

// Sentry source-map upload. Without this every JS frame in a release crash resolves to
// index.android.bundle line 1 (the whole app is one minified line), which is what blocked
// root-causing REACT-NATIVE-2/3/5 — see bug_agent_log.md. This hooks the release bundling
// task so the Hermes bundle + source map are uploaded and Sentry can symbolicate.
// Auth comes from android/sentry.properties (org/project) + the SENTRY_AUTH_TOKEN env var.
apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute(null, rootDir).text.trim(), "../sentry.gradle")

// Upload only when a token actually exists.
//
// The line above used to claim "with no token set, upload is skipped with a warning and
// the build still succeeds". That was NOT true: with no SENTRY_AUTH_TOKEN the upload task
// still ran and failed, taking the release build with it. Both AABs on 2026-08-18 had to
// be built by hand with SENTRY_DISABLE_AUTO_UPLOAD=true, which is not something a release
// process should depend on somebody remembering.
//
// shouldSentryAutoUploadGeneral is an ext hook sentry.gradle.kts publishes specifically so
// it can be overridden right after `apply from` (the Expo disableAutoUpload plugin uses the
// same seam), and it is read once at configuration time. Overriding it here makes the
// behaviour match what the comment always promised: no token -> upload is skipped and the
// build succeeds; token present -> upload happens automatically with no flags to remember.
// SENTRY_DISABLE_AUTO_UPLOAD is still honoured as a manual override.
project.ext.shouldSentryAutoUploadGeneral = {
    System.getenv("SENTRY_DISABLE_AUTO_UPLOAD") != "true" && System.getenv("SENTRY_AUTH_TOKEN") != null
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Run R8 on release builds to minify the Java bytecode.
 *
 * Turned on 2026-08-19 — Play Console flagged "Your app is not optimized" on
 * release 31 (24.0). See android/app/proguard-rules.pro, which was EMPTY until
 * that change; enabling this without those keep rules would strip classes that
 * are only reached reflectively or over JNI (Razorpay checkout, WebRTC, Firebase
 * messaging, Glide) and crash at runtime in the release variant only.
 *
 * If a release-only crash ever appears right after a dependency bump, set this
 * back to false to confirm whether R8 is implicated before debugging anything
 * else — that one flag isolates the entire class of failure.
 *
 * shrinkResources is deliberately NOT enabled alongside this: it removes
 * resources it believes are unreferenced, which breaks anything resolved by
 * name at runtime. One risk at a time.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.astrowanicustomer"
    defaultConfig {
        applicationId "com.astrowanicustomer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 35
        versionName "24.1"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        //  release {
        //     signingConfig signingConfigs.release
        // }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation platform('com.google.firebase:firebase-bom:33.11.0')
    implementation 'com.google.firebase:firebase-messaging'
    // Compat wrapper for the Android 12+ SplashScreen API — the platform's own
    // Theme.SplashScreen isn't a publicly referenceable XML resource, this is
    // the only supported way to customize the cold-start splash from XML.
    implementation 'androidx.core:core-splashscreen:1.0.1'
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
