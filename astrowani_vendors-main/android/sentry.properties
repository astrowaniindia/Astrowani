# Sentry source-map upload config for the vendor app.
#
# The auth token is deliberately NOT here. sentry-cli reads it from the SENTRY_AUTH_TOKEN
# environment variable, so this file carries no secret and is safe to commit. Set the token
# wherever release builds are produced:
#
#   export SENTRY_AUTH_TOKEN=<token>     # then: cd android && ./gradlew assembleRelease
#
# Create the token at https://astrowani.sentry.io/settings/auth-tokens/ with the
# `project:releases` scope only — that is all upload needs. Do not reuse the read-only
# bug-scan token (different scope) or the admin JWT.
#
# With no token set the upload step is skipped and the build still succeeds — you just get
# unsymbolicated stack traces again.

defaults.url=https://sentry.io/
defaults.org=astrowani
defaults.project=astrowani-vendor
