server {
    listen 80;
    server_name ADMIN_DOMAIN_PLACEHOLDER;

    # Admin Panel Root Directory
    root /var/www/astrowani/admin/dist;
    index index.html;

    # Support client-side routing (Vite SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for performance
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
