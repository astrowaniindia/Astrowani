server {
    listen 80;
    server_name backend.astrowani.com;

    # Default is 1MB, which 413s any base64 image upload (admin banner/blog images,
    # astrologer profile photos) before it even reaches Express. Express's own
    # limit (index.js's express.json({limit:'10mb'})) is the real ceiling; this
    # just has to be at or above it.
    client_max_body_size 15m;

    # Backend API and Socket.io Proxy
    location / {
        proxy_pass http://127.0.0.1:4500;
        proxy_http_version 1.1;
        
        # Enable WebSocket support (important for Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
    }
}
