# Install as /etc/nginx/conf.d/astrowani-cloudflare.conf (http context).
#
# Only DEFINES a variable. It changes nothing for any site that does not include
# snippets/astrowani-cloudflare-only.conf, so the other projects on this shared VPS
# are unaffected.
#
# Keyed on $realip_remote_addr, not $remote_addr: once the real_ip module rewrites
# $remote_addr to the visitor's IP, checking that against Cloudflare's ranges would
# reject every real user. $realip_remote_addr is always the TCP peer.
#
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched 2026-09-12).
# Cloudflare changes them rarely; re-check a few times a year and keep this file and
# the snippet in sync.
geo $realip_remote_addr $astrowani_from_cf {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
