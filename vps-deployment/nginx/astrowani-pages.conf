# info.astrowani.com — one-off campaign / landing pages (static site)
#
# Install on the VPS as /etc/nginx/sites-available/astrowani-pages and symlink into
# sites-enabled. Certbot rewrites this file in place when you issue the certificate, adding
# the listen 443 block and the http->https redirect, so run certbot AFTER copying this.
# Mirrors astrowani-shop.conf's structure; see that file for the reasoning on each block.

map $sent_http_content_type $pages_html_cache {
    default        "";
    ~*^text/html   "no-cache, must-revalidate";
}

server {
    listen 80;
    listen [::]:80;
    server_name info.astrowani.com;

    root /var/www/astrowani/pages;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # No API proxy here on purpose — these are static campaign pages with no backend calls.
    # If a future page needs the API, copy the /api/ proxy block from astrowani-shop.conf
    # (proxy to 127.0.0.1:4500, never the public hostname — see that file's comment on why).

    # No HTML page may be cached hard, or a deploy won't reach anyone still holding the old
    # copy. Matched on the response content type so it also covers subfolder index.html
    # pages (join-astrologer/, and whatever gets added next), not just the root document.
    add_header Cache-Control $pages_html_cache always;

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
