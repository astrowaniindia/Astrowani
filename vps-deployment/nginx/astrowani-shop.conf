# shop.astrowani.com — the Astrowani Store storefront (static site)
#
# Install on the VPS as /etc/nginx/sites-available/astrowani-shop and symlink into
# sites-enabled. Certbot rewrites this file in place when you issue the certificate, adding
# the listen 443 block and the http->https redirect, so run certbot AFTER copying this.
# See MD files/vps-git-deploy-guide.md.

server {
    listen 80;
    listen [::]:80;
    server_name shop.astrowani.com;

    root /var/www/astrowani/shop;
    index index.html;

    # The page is one 135 KB HTML document; gzip takes roughly 25 KB off the wire.
    # Images are already-compressed JPEG/PNG, so they're deliberately not listed here —
    # re-compressing them costs CPU and saves nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    # Asset filenames carry a content hash (see astrowani-shop/README.md), so a changed
    # image is a different URL and an old cached copy is simply never requested again.
    # That's what makes "immutable" safe here — without hashed names this would strand
    # visitors on stale images for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must NOT be cached hard, or a deploy won't reach anyone still holding the
    # old copy — it's the file that points at the new hashed asset names.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
