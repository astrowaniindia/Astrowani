# shop.astrowani.com — the Astrowani Store storefront, plus astrowani-website under /test-site/
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ THE LIVE FILE IS THE AUTHORITY. MERGE INTO IT; NEVER COPY THIS OVER IT.      │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# This is a mirror of /etc/nginx/sites-available/astrowani-shop as read from the
# VPS on 2026-10-30, with the Certbot-managed lines left out (Certbot rewrites
# the file in place when the certificate is issued, adding the `listen 443 ssl`
# block, the TLS paths and the separate port-80 redirect server).
#
# WHY THE WARNING IS IN A BOX. On 2026-10-29 this file was edited to add the
# three blog proxy locations below while the LIVE file had meanwhile gained the
# /test-site/ 404 handling and the cache rules — which were applied directly on
# the server and never written back here. Copying this file over the live one at
# that point would have shipped the blog routes and SILENTLY UNDONE the 404 fix,
# putting every missing URL back to answering 200 with index.html. That is the
# single most damaging SEO fault the 2026-10-29 audit found, and it had just
# been fixed. The drift was five blocks wide, not one.
#
# So: read the live file first, diff it against this, and apply the difference.
#
# APPLIED 2026-10-30. The three `blog` locations below are now on the server,
# merged in by .github/workflows/apply-nginx-blog-routes.yml (backup, splice,
# `nginx -t`, reload, restore-on-failure). This file and the live one agree.
# Re-running that workflow is a no-op; it detects the locations and exits.
#
# They proxy to routes that exist only in src/blogPublic.js and
# src/blogArchive.js, so the backend carrying them must stay deployed — it was
# confirmed answering 200 before the locations went in.

# Empty for everything except HTML, and nginx omits add_header entirely when the value
# is empty, so only HTML documents carry a Cache-Control from this.
map $sent_http_content_type $shop_html_cache {
    default        "";
    ~*^text/html   "no-cache, must-revalidate";
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.astrowani.com;
    # Only Cloudflare may reach the origin. NOTE this is also why a curl from the
    # VPS to its own hostname returns 000 — 127.0.0.1 is not a Cloudflare range,
    # so anything user-facing has to be verified from OUTSIDE the box.
    include snippets/astrowani-cloudflare-only.conf;

    root /var/www/astrowani/shop;
    index index.html;

    # The page is one 135 KB HTML document; gzip takes roughly 25 KB off the wire.
    # Images are already-compressed JPEG/PNG, so they're deliberately not listed here —
    # re-compressing them costs CPU and saves nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    # Same-origin proxy to the API. The storefront used to call
    # https://backend.astrowani.com directly and every request was refused by CORS:
    # nginx on the backend echoes an Access-Control-Allow-Origin only for an allowlist
    # that shop.astrowani.com was not on.
    #
    # Proxying rather than widening that allowlist, for two reasons. The backend already
    # sets that header itself, so adding a second source of it risks duplicate
    # Access-Control-Allow-Origin headers, which browsers reject outright — that would
    # break the admin dashboard. And to the browser these calls are now same-origin, so
    # CORS never enters into it and there is no preflight round trip on every request.
    #
    # Proxy to the backend on loopback, NEVER to its public hostname. nginx resolves a
    # hostname in proxy_pass once, at startup, and refuses to start at all if that lookup
    # fails. On 2026-09-11 06:32 UTC unattended-upgrades (libc6) restarted nginx, DNS was
    # briefly unavailable, "host not found in upstream backend.astrowani.com" failed the
    # config test, and every site on this VPS was down for ~13h. Loopback has no DNS, no
    # TLS and no Cloudflare round trip.
    location /api/ {
        proxy_pass http://127.0.0.1:4500/api/;
        proxy_http_version 1.1;
        proxy_set_header Host backend.astrowani.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The customer JWT rides in this header; without it every call is a 401.
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # Asset filenames carry a content hash (see astrowani-shop/README.md), so a changed
    # image is a different URL and an old cached copy is simply never requested again.
    # That's what makes "immutable" safe here — without hashed names this would strand
    # visitors on stale images for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # No HTML page may be cached hard, or a deploy won't reach anyone still holding the
    # old copy — HTML is what points at the new hashed asset names.
    #
    # This is matched on the RESPONSE content type, not the request path, and that is
    # deliberate. The obvious `location = /index.html` only covers the root document;
    # /gemstones/ and /pujas/ are served from their own index.html via the `index`
    # directive, so the request URI never ends in .html and a path-based rule silently
    # misses them. With no Cache-Control at all a client MAY cache heuristically, and an
    # in-app webview did exactly that — it kept serving a storefront page whose sections
    # had already been fixed, for long enough to look like a code bug.
    #
    # The /assets/ block above declares its own add_header, so it does not inherit this
    # one and keeps its immutable year — which is correct, those filenames are hashed.
    add_header Cache-Control $shop_html_cache always;

    # ---- astrowani-website, served under /test-site/ ----
    #
    # The SPA fallback in `location /` below is correct for the SHOP and WRONG
    # here: it makes every missing URL answer 200 with index.html, so a typo or a
    # stale link becomes a page Google is entitled to index, without limit.
    # Measured 2026-10-29: GET /test-site/no-such-page-xyz -> 200 OK.
    # This block gives that subtree a real 404 and leaves the shop untouched.
    location /test-site/ {
        error_page 404 /test-site/404.html;
        try_files $uri $uri/ =404;
    }

    location = /test-site/404.html {
        internal;
    }

    # Its CSS/JS carry ?v=N (bumped by aw/bump-version.js), so the URL changes
    # whenever the content does and the response can safely be immutable.
    # HTML is deliberately excluded -- it has no version string.
    location ~* ^/test-site/.+\.(css|js|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/test-site/.+\.(png|jpe?g|webp|gif|svg|ico|woff2?|glb)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ---- APPLIED ON THE SERVER 2026-10-30 (see the header) ----
    #
    # The blog listing and article pages render entirely in JavaScript, so the
    # initial HTML a crawler and a social-card fetcher receive carries the
    # generic template title and canonical and no <h1> at all. Measured live
    # 2026-10-30: `<title>Blog — Astrowani`, canonical pointing at the bare
    # template, zero <h1>, and an unknown slug answering 200 instead of 404.
    # These three locations hand those URLs to the backend, which renders the
    # article text and its own metadata before any JavaScript runs.
    #
    # They are EXACT-match locations, so they take precedence over the
    # `location /test-site/` prefix block above whatever the order in this file —
    # the 404 handling keeps applying to every other path in that subtree.
    location = /test-site/blog.html {
        proxy_pass http://127.0.0.1:4500/api/blogs/archive-page$is_args$args;
        proxy_set_header Host backend.astrowani.com;
    }
    location = /test-site/blog-post.html {
        proxy_pass http://127.0.0.1:4500/api/blogs/article-page$is_args$args;
        proxy_set_header Host backend.astrowani.com;
    }
    location = /test-site/hi/blog-post.html {
        proxy_pass http://127.0.0.1:4500/api/blogs/article-page?lang=hi&$args;
        proxy_set_header Host backend.astrowani.com;
    }
    # There is deliberately NO /test-site/hi/blog.html here. The archive route
    # has no Hindi support at all (src/blogArchive.js never reads `lang`), so
    # pointing the Hindi listing at it would serve an English archive under a
    # Hindi URL — a duplicate rather than a translation. It stays on the static
    # generated page, whose article links resolve to the Hindi article route
    # above, so the chain still ends in Hindi.

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
