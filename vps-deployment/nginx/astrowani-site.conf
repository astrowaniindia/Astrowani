# astrowani.com — the Astrowani website (astrowani-website/), from launch day 2026-11-20.
#
# Installed by .github/workflows/apply-astrowani-site.yml (manual), which also
# installs the TLS certificate and wordpress-redirects.conf, runs `nginx -t`, and
# restores the previous state if the test fails. Unlike astrowani-shop, Certbot
# never edits this file, so the repo copy IS the live file: change it here and
# re-run the workflow.
#
# ─── WHAT MUST BE TRUE BEFORE THIS IS SERVED ─────────────────────────────────
# 1. Both DNS records (@ and www) are PROXIED (orange cloud) in Cloudflare.
#    The Cloudflare-only include below closes every connection that does not
#    come from Cloudflare, so a grey-cloud record would make the site
#    unreachable for every visitor.
# 2. Cloudflare SSL/TLS mode is "Full (strict)". The certificate here is a
#    CLOUDFLARE ORIGIN CERTIFICATE: trusted by Cloudflare, by nobody else. That
#    is what lets it be installed BEFORE the DNS moves (no Let's Encrypt
#    challenge needs the domain to point here first), so the switch has no
#    window in which visitors reach this server without a valid certificate.
#    "Flexible" would make Cloudflare talk plain HTTP to us, our http->https
#    redirect would send it back, and the browser would loop.
# 3. The backend is deployed with BLOG_SITE_BASE_URL=https://astrowani.com, or
#    the server-rendered blog/profile/story pages name the old test address.
#
# The MX and TXT records stay on Hostinger. Email is not affected by any of this.
# ────────────────────────────────────────────────────────────────────────────

# HTML must never be cached hard, or a deploy does not reach anyone holding the
# old copy. Matched on the response type, not the path (see astrowani-shop.conf:
# a folder-style address such as /privacy-policy/ never ends in .html).
map $sent_http_content_type $aw_site_html_cache {
    default        "";
    ~*^text/html   "no-cache, must-revalidate";
}

# ── http:// -> https://astrowani.com ──
server {
    listen 80;
    listen [::]:80;
    server_name astrowani.com www.astrowani.com;
    include snippets/astrowani-cloudflare-only.conf;
    return 301 https://astrowani.com$request_uri;
}

# ── www -> the bare domain. One address per page, or Google splits the signals.
server {
    # No http2: Cloudflare speaks HTTP/1.1 to the origin anyway, and on nginx 1.24 a
    # `listen … http2` here would switch it on for every other site on port 443.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.astrowani.com;
    include snippets/astrowani-cloudflare-only.conf;
    ssl_certificate     /etc/ssl/astrowani/origin.pem;
    ssl_certificate_key /etc/ssl/astrowani/origin.key;
    return 301 https://astrowani.com$request_uri;
}

server {
    # No http2: Cloudflare speaks HTTP/1.1 to the origin anyway, and on nginx 1.24 a
    # `listen … http2` here would switch it on for every other site on port 443.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name astrowani.com;
    include snippets/astrowani-cloudflare-only.conf;

    ssl_certificate     /etc/ssl/astrowani/origin.pem;
    ssl_certificate_key /etc/ssl/astrowani/origin.key;

    root /var/www/astrowani/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml application/json application/xml text/plain;

    # ── Old WordPress addresses (wordpress-redirects.conf, an http-level map).
    # Must stay BEFORE every location: `if` with only `return` inside is the one
    # safe form of `if` in nginx. The legal pages are deliberately NOT redirected
    # by it — the map names their old addresses with an empty value, so they
    # fall through to the exact locations below and are served in place.
    if ($astrowani_wp_redirect) { return 301 $astrowani_wp_redirect; }

    # ── THE LEGAL PAGES ANSWER AT THEIR OLD WORDPRESS ADDRESSES ──────────────
    # Owner's decision, launch day: these URLs are written into both apps, App
    # Store Connect, Play Console and the Meta developer app, and none of those
    # should ever have to change. So /privacy-policy/ IS the page (200), and
    # /privacy-policy.html is what 301s (in the map). The list must equal
    # astrowani-website/aw/legal-paths.js; check-wordpress-redirects.js fails if
    # it does not. Each page carries <base href="/"> (or "/hi/"), written by
    # aw/apply-seo.js, so its relative links resolve from this folder depth.
    location = /privacy-policy/          { try_files /privacy-policy.html =404; }
    location = /term_conditions/         { try_files /terms-and-conditions.html =404; }
    location = /refund_cancellation/     { try_files /refund-cancellation.html =404; }
    location = /delete-account/          { try_files /delete-account.html =404; }
    location = /child-safety/            { try_files /child-safety.html =404; }
    location = /safety-guidelines/       { try_files /safety-guidelines.html =404; }
    location = /report-vulnerability/    { try_files /report-vulnerability.html =404; }
    location = /hi/privacy-policy/       { try_files /hi/privacy-policy.html =404; }
    location = /hi/term_conditions/      { try_files /hi/terms-and-conditions.html =404; }
    location = /hi/refund_cancellation/  { try_files /hi/refund-cancellation.html =404; }
    location = /hi/delete-account/       { try_files /hi/delete-account.html =404; }
    location = /hi/child-safety/         { try_files /hi/child-safety.html =404; }
    location = /hi/safety-guidelines/    { try_files /hi/safety-guidelines.html =404; }
    location = /hi/report-vulnerability/ { try_files /hi/report-vulnerability.html =404; }

    # One homepage address. The canonical already names "/". Tested on
    # $request_uri, NOT with `location = /index.html`: the `index` directive
    # turns a request for "/" into an INTERNAL redirect to /index.html, which
    # such a location would answer with a 301 back to "/" — an endless loop.
    # $request_uri is the address the browser asked for, so internal
    # redirects never match it.
    if ($request_uri ~ "^/(hi/)?index\.html(\?.*)?$") { return 301 /$1; }

    # ── Same-origin API proxy. aw/config.js lists astrowani.com as an origin
    # whose /api/ is proxied, so WITHOUT this block login, wallet, the blog list
    # and the astrologer roster all fail. Loopback, never the public hostname: a
    # hostname in proxy_pass is resolved once at startup and a failed lookup
    # stops nginx starting at all (the 2026-09-11 13-hour outage).
    location /api/ {
        proxy_pass http://127.0.0.1:4500/api/;
        proxy_http_version 1.1;
        proxy_set_header Host backend.astrowani.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # ── The sitemap, on the site's own host. It is generated by the backend
    # (src/blogSitemap.js) because the blog agent publishes into the database
    # and cannot commit a file here. Same-host is what Search Console and
    # robots.txt expect; the backend URL keeps working too.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4500/api/blogs/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host backend.astrowani.com;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Server-rendered pages (the same routes as blog-locations.conf, without
    # the /test-site prefix). The backend renders the article / profile /
    # story with its own title, canonical and <h1> before any JavaScript runs.
    location = /blog.html {
        proxy_pass http://127.0.0.1:4500/api/blogs/archive-page$is_args$args;
        proxy_set_header Host backend.astrowani.com;
    }
    location = /hi/blog.html {
        proxy_pass http://127.0.0.1:4500/api/blogs/archive-page?lang=hi&$args;
        proxy_set_header Host backend.astrowani.com;
    }
    location = /blog-post.html {
        proxy_pass http://127.0.0.1:4500/api/blogs/article-page$is_args$args;
        proxy_set_header Host backend.astrowani.com;
    }
    location = /hi/blog-post.html {
        proxy_pass http://127.0.0.1:4500/api/blogs/article-page?lang=hi&$args;
        proxy_set_header Host backend.astrowani.com;
    }
    # route=clean is how src/blogPublic.js knows the request came in at the
    # clean address; every other form of an article URL is 301ed to here.
    location ~ ^/blog/([a-z0-9-]+)/?$ {
        proxy_pass http://127.0.0.1:4500/api/blogs/article-page?slug=$1&route=clean;
        proxy_set_header Host backend.astrowani.com;
    }
    location ~ ^/hi/blog/([a-z0-9-]+)/?$ {
        proxy_pass http://127.0.0.1:4500/api/blogs/article-page?lang=hi&slug=$1&route=clean;
        proxy_set_header Host backend.astrowani.com;
    }
    location ~ ^/astrologers/([a-z0-9-]+)/?$ {
        proxy_pass http://127.0.0.1:4500/api/web/astrologer-page?slug=$1;
        proxy_set_header Host backend.astrowani.com;
    }
    # No dot in the pattern, so the nightly horoscope stories
    # (stories/<sign>-horoscope.html, plain files) never match it.
    location ~ ^/stories/([a-z0-9-]+)/?$ {
        proxy_pass http://127.0.0.1:4500/api/blogs/story-page?slug=$1;
        proxy_set_header Host backend.astrowani.com;
    }
    location ~ ^/hi/stories/([a-z0-9-]+)/?$ {
        proxy_pass http://127.0.0.1:4500/api/blogs/story-page?lang=hi&slug=$1;
        proxy_set_header Host backend.astrowani.com;
    }

    # ── Static files. CSS/JS carry ?v=N and images ?h=<hash>, so a changed file
    # is a new URL.
    location ~* \.(css|js|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.(png|jpe?g|webp|gif|svg|ico|woff2?|glb)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Every missing address is a real 404 — never index.html with a 200, which
    # would let Google index an unlimited number of copies of the homepage.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }

    add_header Cache-Control $aw_site_html_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
