    # The blog listing and article pages render entirely in JavaScript, so the
    # initial HTML a crawler or a social-card fetcher receives carries the generic
    # template title and canonical and no <h1> at all. These three locations hand
    # those URLs to the backend, which renders the article and its own metadata
    # before any JavaScript runs.
    #
    # EXACT-match locations, so they take precedence over the `location /test-site/`
    # prefix block whatever the order in this file — the 404 handling keeps applying
    # to every other path in that subtree.
    #
    # They proxy to routes that exist only in src/blogPublic.js and
    # src/blogArchive.js. Applying them before that backend is deployed turns the
    # blog into a 502.
    location = /test-site/blog.html {
        proxy_pass http://127.0.0.1:4500/api/blogs/archive-page$is_args$args;
        proxy_set_header Host backend.astrowani.com;
    }
    location = /test-site/blog-post.html {
        proxy_pass http://127.0.0.1:4500/api/blogs/article-page$is_args$args;
        proxy_set_header Host backend.astrowani.com;
    }
    location = /test-site/hi/blog-post.html {
        proxy_pass http://127.0.0.1:4500/api/blogs/article-page?lang=hi&$args;
        proxy_set_header Host backend.astrowani.com;
    }
    # There is deliberately NO /test-site/hi/blog.html: the archive route has no
    # Hindi support (src/blogArchive.js never reads `lang`), so pointing the Hindi
    # listing at it would serve an English archive under a Hindi URL — a duplicate
    # rather than a translation. It stays on the static generated page, whose
    # article links resolve to the Hindi article route above.

