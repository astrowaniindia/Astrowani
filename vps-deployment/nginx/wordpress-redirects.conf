# ============================================================================
# OLD WORDPRESS ADDRESSES -> THE NEW SITE.   Needed ON THE DAY astrowani.com
# stops being WordPress and starts serving astrowani-website.
#
# WHY THIS EXISTS. WordPress gives every page a folder-style address
# (astrowani.com/privacy-policy/). The new site is plain files
# (astrowani.com/privacy-policy.html). Without this file every old address
# returns 404 the moment the domain moves — and those addresses are written
# into places we cannot change quickly:
#
#   - BOTH APPS link to /privacy-policy/, /term_conditions/, /refund_cancellation/,
#     /delete-account/, /child-safety/, /safety-guidelines/, /report-vulnerability/,
#     /about-us/ and /faq/. Installed builds would open broken pages.
#   - App Store Connect, Play Console (privacy policy, account deletion, child
#     safety) and the Meta developer app hold these URLs. Apple and Google check
#     them; a dead privacy-policy or delete-account link can get an app flagged.
#   - Google has every one of them indexed. A 301 passes the ranking on to the
#     new page; a 404 throws it away.
#
# HOW TO INSTALL: run the "Apply astrowani.com site" GitHub workflow
# (.github/workflows/apply-astrowani-site.yml). It copies this file to
# /etc/nginx/conf.d/astrowani-wordpress-redirects.conf (conf.d is included
# inside the http{} block, which is where a `map` must live) together with
# astrowani-site.conf, whose server block already carries the line
#          if ($astrowani_wp_redirect) { return 301 $astrowani_wp_redirect; }
# (`if` with only a `return` inside is the one form of `if` that is safe in
# nginx), runs `nginx -t`, and reloads. Then, after the DNS points here:
#        node vps-deployment/scripts/check-wordpress-redirects.js --live
#      It requests every old address and fails unless each one 301s to the right
#      page and that page answers 200.
#
# HOW IT MATCHES. $uri is the DECODED path without the query string, so the
# Hindi post is matched by its Devanagari text, not its %e0%a4.. form. Every
# rule is case-insensitive (~*) and accepts the address with or without its
# trailing slash, the way WordPress did. Rules are tried top to bottom and the
# FIRST match wins, so specific rules sit above the broad ones.
#
# THE LIST CAME FROM https://astrowani.com/sitemap.xml (fetched 2026-11-16, 83
# addresses) plus /about-us/, which the apps link to but the sitemap omits.
# The full snapshot is vps-deployment/nginx/wordpress-old-urls.txt. If pages
# are added to WordPress before the move, re-fetch it and add them here — the
# checker fails on any address with no rule.
#
# The WANI SHOP stays on shop.astrowani.com, so shop addresses redirect there.
# ============================================================================

map $uri $astrowani_wp_redirect {
    default "";

    # ── Legal pages — the ones the apps and the store consoles link to ──────
    #
    # CHANGED ON LAUNCH DAY (2026-11-20, owner's decision): these are NOT
    # redirected any more. The old address IS the page, served in place by the
    # exact locations in astrowani-site.conf, so the apps, App Store Connect,
    # Play Console and the Meta app keep pointing at the real page forever and
    # nothing outside this repo ever has to change. The list must equal
    # astrowani-website/aw/legal-paths.js (the checker enforces it).
    #
    # The empty value is what lets them through. nginx tries a map's EXACT
    # strings before any regex, whatever the order in this file, so the exact
    # address resolves to "" (no redirect) even though the regex below it would
    # also match. Every OTHER spelling — no trailing slash, the new site's own
    # .html file name, odd capitalisation — gets a 301 to the one real address.
    "/privacy-policy/"                      "";
    "/term_conditions/"                     "";
    "/refund_cancellation/"                 "";
    "/delete-account/"                      "";
    "/child-safety/"                        "";
    "/safety-guidelines/"                   "";
    "/report-vulnerability/"                "";
    "/hi/privacy-policy/"                   "";
    "/hi/term_conditions/"                  "";
    "/hi/refund_cancellation/"              "";
    "/hi/delete-account/"                   "";
    "/hi/child-safety/"                     "";
    "/hi/safety-guidelines/"                "";
    "/hi/report-vulnerability/"             "";
    "~*^/(privacy-policy/?|privacy-policy\.html)$"              /privacy-policy/;
    "~*^/(term_conditions/?|terms-and-conditions\.html)$"       /term_conditions/;
    "~*^/(refund_cancellation/?|refund-cancellation\.html)$"    /refund_cancellation/;
    "~*^/(delete-account/?|delete-account\.html)$"              /delete-account/;
    "~*^/(child-safety/?|child-safety\.html)$"                  /child-safety/;
    "~*^/(safety-guidelines/?|safety-guidelines\.html)$"        /safety-guidelines/;
    "~*^/(report-vulnerability/?|report-vulnerability\.html)$"  /report-vulnerability/;
    "~*^/hi/(privacy-policy/?|privacy-policy\.html)$"           /hi/privacy-policy/;
    "~*^/hi/(term_conditions/?|terms-and-conditions\.html)$"    /hi/term_conditions/;
    "~*^/hi/(refund_cancellation/?|refund-cancellation\.html)$" /hi/refund_cancellation/;
    "~*^/hi/(delete-account/?|delete-account\.html)$"           /hi/delete-account/;
    "~*^/hi/(child-safety/?|child-safety\.html)$"               /hi/child-safety/;
    "~*^/hi/(safety-guidelines/?|safety-guidelines\.html)$"     /hi/safety-guidelines/;
    "~*^/hi/(report-vulnerability/?|report-vulnerability\.html)$" /hi/report-vulnerability/;

    # ── Company ─────────────────────────────────────────────────────────────
    "~*^/home/?$"                           /;
    "~*^/(about-us|our-achivements|contact-us)/?$"   /about.html;
    "~*^/faq/?$"                            /;
    "~*^/our-services/?$"                   /consult.html;
    "~*^/(videos|special|elementor-9)/?$"   /;

    # ── Astrologers. No profile pages on the new site yet, so the listing. ──
    "~*^/(astrologers|astrologers-5)/?$"    /astrologers.html;
    "~*^/(numerologist-shivani|numerologist-jiyendra|shivani-sharma|astro-mahi-sharma|tarot-sampada|astro-akhilesh-sharma|astro-anjali|astro-rishiraj|astro-dilip-sharma)/?$"   /astrologers.html;
    "~*^/astrologer-ragistration/?$"        /astrologer-registration.html;

    # ── Booking and services ────────────────────────────────────────────────
    "~*^/(book-call|book-appointment|booking-without-astrologer)/?$"   /book-call.html;
    "~*^/matchmaking/?$"                    /marriage.html;
    "~*^/courses/?$"                        /courses.html;

    # ── Blog. The one old post that exists in the new blog goes to itself;
    #    the others go to the page on the same subject, which keeps more of
    #    their value than the blog index would. ──────────────────────────────
    "~*^/special-saturn-remedy-package-for-on-going-blessings/?$"   /blog/special-remedy-for-sani;
    "~*^/vastu-surely-affects-our-life/?$"  /vastu.html;
    "~*^/your-birt-charts-planets-makes-you-actual-star/?$"   /kundli-reading.html;
    "~*^/क्या-है-राहु-काल/?$"               /panchang.html;
    "~*^/stars-voice/?$"                    /blog.html;
    "~*^/(blog|blog-2|new-blog)/?$"         /blog.html;
    "~*^/category/"                         /blog.html;

    # ── Wani Shop -> shop.astrowani.com, by section where one fits ──────────
    "~*^/wani/(emrald-panna-725-ratti|precious-gemstone|ruby-manikya|blue-sapphire-neelam|yellow-sapphire-pukhraj)/?$"   https://shop.astrowani.com/gemstones/;
    "~*^/(energized-gemstones|product-category/gemstone)/?$"   https://shop.astrowani.com/gemstones/;
    "~*^/wani/(puja-samagri|sree-yantra-with-laxmi-puja)/?$"   https://shop.astrowani.com/pujas/;
    "~*^/(book-puja|product-category/online-puja)/?$"          https://shop.astrowani.com/pujas/;
    "~*^/wani/(vastu-dosh-niwarak-yantra|vastu-niwarak-pearl-haliix|vastu-super-brass-helix|copper-pyramid|meru-yantra-pyramid)/?$"   https://shop.astrowani.com/vastu/;
    "~*^/product-category/(vastu-products|piramids)/?$"        https://shop.astrowani.com/vastu/;
    "~*^/wani/"                             https://shop.astrowani.com/;
    "~*^/(wanishop|shop|collection|rudraksha)/?$"             https://shop.astrowani.com/;
    "~*^/(product-category|product-tag|brand)/"               https://shop.astrowani.com/;
}
