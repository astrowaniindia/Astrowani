# Install as /etc/ssh/sshd_config.d/00-hardening.conf, then `sshd -t && systemctl restart ssh`.
#
# The 00- prefix matters: sshd keeps the FIRST value it reads for each option, and
# cloud-init's 50-cloud-init.conf sets PasswordAuthentication yes.
#
# Before 2026-09-12 root could log in with a password, and the logs showed 835 failed
# password guesses in 7 days. Every legitimate login in that window used a key (the
# Hostinger web console and the GitHub Actions deploy key), so this locks nobody out.
# Verify from outside:  ssh -o PubkeyAuthentication=no root@<vps>  ->  Permission denied (publickey)
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
