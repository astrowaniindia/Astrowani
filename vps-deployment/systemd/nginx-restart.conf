# systemd drop-in: keep nginx coming back after a failed start.
#
# Install on the VPS:
#   mkdir -p /etc/systemd/system/nginx.service.d
#   cp vps-deployment/systemd/nginx-restart.conf /etc/systemd/system/nginx.service.d/restart.conf
#   systemctl daemon-reload
#
# Stock nginx.service has no Restart= at all. On 2026-09-11 an unattended-upgrades
# restart failed once (transient DNS failure during the config test) and nginx stayed
# dead for ~13h, taking every site on the VPS with it. With this, systemd retries every
# 10s indefinitely, so a transient failure heals itself within seconds.

[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10s
