# Astrowani website — the two SEO fixes that can only be made on the server.
#
# Everything else from the 2026-10-29 audit is in the repo. These two are not,
# because they are HTTP behaviour rather than page content, and nothing in
# astrowani-website/ can change them.
#
# HOW TO APPLY. Paste these into the server{} block that serves the website, then
#   sudo nginx -t && sudo systemctl reload nginx
# Run it as root from the Hostinger hPanel browser console — the `deploy` SSH
# user has no sudo.
#
# ===========================================================================
# 1. MISSING PAGES MUST RETURN 404, NOT 200.
#
# Measured 2026-10-29:  GET /test-site/no-such-page-xyz  ->  200 OK
#
# This is the most damaging single fault on the site. A 200 on a non-existent
# URL tells Google the page is real, so every typo, every stale inbound link and
# every crawler guess becomes an indexable page. It creates unlimited junk URLs
# and there is no upper bound on how many get indexed.
#
# 404.html already exists in the repo and is styled like the rest of the site.
# The `=404` on the internal location is what stops a missing 404.html turning
# into a redirect loop.
# ===========================================================================

error_page 404 /404.html;

location = /404.html {
    internal;
}

# try_files must END in =404, never in a fallback page or /index.html.
# A SPA-style `try_files $uri $uri/ /index.html;` is exactly how a site starts
# answering 200 for everything — if that line is present, this is the fix.
location / {
    try_files $uri $uri/ =404;
}

# ===========================================================================
# 2. VERSIONED ASSETS SHOULD BE CACHED FOR A YEAR, NOT FOUR HOURS.
#
# Measured 2026-10-29:  Cache-Control: max-age=14400   (4 hours)
#
# Every CSS and JS URL on this site already carries ?v=N cache-busting, bumped
# by aw/bump-version.js on every change — so the URL itself changes whenever the
# content does and the response can safely be immutable. At four hours, a
# returning visitor re-downloads the lot roughly daily for no reason.
#
# HTML is deliberately NOT included: it has no version string, so it must stay
# revalidated or a deploy would not reach anyone.
# ===========================================================================

location ~* \.(css|js|mjs)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~* \.(png|jpe?g|webp|gif|svg|ico|woff2?|glb)$ {
    # Images and fonts are referenced without ?v=, so they get a long but not
    # immutable cache — long enough to help, short enough that replacing a file
    # in place still reaches people within a week.
    add_header Cache-Control "public, max-age=604800" always;
}

location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# ===========================================================================
# 3. NOT AN NGINX CHANGE, BUT THE SAME CLASS OF PROBLEM — READ THIS.
#
# robots.txt is only ever read from a HOST ROOT. While the site is served from
# shop.astrowani.com/test-site/, a crawler reads shop.astrowani.com/robots.txt
# — which is a Cloudflare content-signals file, nothing to do with this site —
# and never sees astrowani-website/robots.txt. Both its rules and its Sitemap
# line do nothing today.
#
# THE SITEMAP STILL HAS TO BE SUBMITTED BY HAND in Search Console either way,
# because a Sitemap: line in a robots.txt nobody fetches declares nothing:
#   https://backend.astrowani.com/api/blogs/sitemap.xml
#
# But the host root CAN be served properly in the meantime — see section 4.
#
# And when it does take the domain, / and /index.html must not both answer 200.
# Pick one and 301 the other, or the canonical tags are doing that work alone:
#
#   location = /index.html { return 301 https://astrowani.com/; }
# ===========================================================================

# ===========================================================================
# 4. SERVE A REAL robots.txt AT THE HOST ROOT.
#
# Measured 2026-10-29: shop.astrowani.com/robots.txt returned Cloudflare's
# content-signals directives followed by the shop's own HTML document — because
# nginx has no route for that path and the storefront's SPA fallback answered.
# Google will parse the rules it recognises out of that, so this is untidiness
# rather than a crawl block, but it is not a resource anybody chose to serve.
#
# THIS HOST CARRIES THE STOREFRONT AS WELL AS THE WEBSITE, which is why the file
# is permissive by default: vps-deployment/nginx/robots-shop-host.txt allows
# everything and names only the live consultation screens, so the shop is as
# crawlable after this change as before it. Read it before applying — this is
# the one item here that changes crawl policy for a live storefront, not just
# for the preview site.
#
#   sudo cp vps-deployment/nginx/robots-shop-host.txt \
#     /var/www/astrowani/shop/robots.txt
#
# It is served explicitly rather than left to try_files so that the SPA fallback
# can never shadow it again, and so a missing file is an honest 404 instead of
# the shop's index.html.
# ===========================================================================

location = /robots.txt {
    root /var/www/astrowani/shop;
    types { } default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    try_files /robots.txt =404;
}
